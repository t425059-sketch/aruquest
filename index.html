<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>あるくえすと</title>
<style>
:root{--bg:#F4F6F8;--ink:#1E2A3A;--mute:#65718A;--o:#E7892B;--b:#3B6FD4;--g:#1F8A70;--line:#E2E7EE}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Maru Gothic ProN","BIZ UDPGothic","Yu Gothic UI","Meiryo",sans-serif;line-height:1.55}
.o{--c:var(--o)}.b{--c:var(--b)}.g{--c:var(--g)}
svg{display:block}
header{position:sticky;top:0;z-index:3;background:#fff;border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
.bar{max-width:480px;margin:0 auto;display:flex;align-items:center;gap:8px}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;flex:1;min-width:0}
.logo i{width:32px;height:32px;border-radius:10px;background:var(--g);color:#fff;display:grid;place-items:center;flex:none}
.chip{display:flex;align-items:center;gap:4px;border-radius:999px;padding:3px 12px;font-weight:700;font-size:14px;background:var(--bg)}
.chip.lv{background:var(--ink);color:#fff}
.chip.bump{animation:bump .4s}
@keyframes bump{50%{transform:scale(1.2)}}
.plus{position:fixed;top:calc(env(safe-area-inset-top) + 48px);right:18px;z-index:9;color:var(--g);font-weight:700;animation:up 1.1s ease-out forwards}
@keyframes up{from{transform:translateY(22px);opacity:0}30%{opacity:1}to{transform:translateY(-6px);opacity:0}}
main{max-width:480px;margin:0 auto;padding:16px 16px calc(150px + env(safe-area-inset-bottom))}
h1{font-size:22px;margin:0 0 2px}
h2{font-size:16px;margin:0}
.sub{margin:0 0 14px;color:var(--mute);font-size:14px}
.prog{height:10px;background:#E4E9F0;border-radius:99px;overflow:hidden;margin-bottom:18px}
.prog i{display:block;height:100%;background:var(--g);border-radius:99px;transition:width .4s}
.q{display:flex;align-items:center;gap:12px;background:#fff;border-radius:20px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(30,42,58,.08)}
.ic{flex:none;width:48px;height:48px;border-radius:16px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 14%,#fff)}
.q div{flex:1;min-width:0}
.tag{display:inline-block;font-size:12px;padding:0 9px;border-radius:99px;background:color-mix(in srgb,var(--c) 16%,#fff);margin-right:6px}
.pt{font-size:13px;color:var(--mute)}
.go{flex:none;width:52px;height:52px;border-radius:50%;border:0;background:var(--c);color:#fff;display:grid;place-items:center;cursor:pointer}
.q.done{opacity:.6}.q.done .go{background:var(--g);cursor:default}
.fab{position:fixed;right:18px;bottom:calc(78px + env(safe-area-inset-bottom));width:62px;height:62px;border-radius:50%;border:0;background:var(--g);color:#fff;display:grid;place-items:center;box-shadow:0 6px 16px rgba(31,138,112,.4);cursor:pointer;z-index:4}
nav{position:fixed;left:0;right:0;bottom:0;z-index:3;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;color:var(--mute);font:inherit;font-size:12px;padding:8px 0 6px;display:grid;justify-items:center;gap:2px;cursor:pointer}
nav button[aria-current=page]{color:var(--g);font-weight:700}
:focus-visible{outline:3px solid var(--b);outline-offset:2px}
.paper{background:#FBF6E9 repeating-linear-gradient(transparent 0 31px,#E7DFC8 31px 32px);border-radius:6px 18px 18px 6px;padding:18px 16px 14px 34px;position:relative;box-shadow:0 2px 6px rgba(30,42,58,.12)}
.paper::before{content:"";position:absolute;left:10px;top:20px;bottom:20px;width:10px;background:radial-gradient(circle,#B9B29B 4px,transparent 5px) 0 0/10px 40px}
.paper h2{margin-bottom:12px;font-size:15px}
.dex{display:grid;grid-template-columns:1fr 1fr;gap:16px 14px}
.st{margin:0;text-align:center;position:relative}
.st .im{width:100%;aspect-ratio:1;border-radius:4px;background:#fff;border:6px solid #fff;box-shadow:0 2px 5px rgba(30,42,58,.25);object-fit:cover;display:grid;place-items:center;font-size:30px;color:var(--c);transform:rotate(var(--r))}
.st:nth-child(odd){--r:-2deg}.st:nth-child(even){--r:1.5deg}
.st::before{content:"";position:absolute;top:-6px;left:50%;width:42px;height:14px;margin-left:-21px;background:color-mix(in srgb,var(--c) 40%,#fff);opacity:.8;z-index:1;transform:rotate(-3deg)}
.st figcaption{font-size:13px;margin-top:6px}
.st.e{--c:#B9B29B}.st.e .im{background:transparent;border:2px dashed #B9B29B;box-shadow:none;color:#B9B29B}.st.e::before{display:none}
.card{background:#fff;border-radius:20px;padding:16px;box-shadow:0 1px 3px rgba(30,42,58,.08);margin-bottom:18px;display:flex;align-items:center;gap:16px}
.ring{position:relative;flex:none;width:96px;height:96px}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:18px}
.big{font-size:34px;font-weight:700;line-height:1.1}.big small{font-size:15px;margin-left:3px}
.tk{display:flex;align-items:center;background:#fff;border-radius:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(30,42,58,.08);overflow:hidden}
.tk>div{flex:1;padding:12px 14px}.tk p{margin:0;font-size:14px;color:var(--mute)}
.tk button{align-self:stretch;width:92px;border:0;border-left:2px dashed var(--line);background:color-mix(in srgb,var(--o) 14%,#fff);font:inherit;font-weight:700;font-size:13px;color:var(--ink);cursor:pointer}
.tk button:disabled{opacity:.45;cursor:default}
.lnk{display:block;margin:18px auto 0;border:0;background:none;color:var(--mute);font:inherit;font-size:13px;text-decoration:underline}
#sheet{position:fixed;inset:0;z-index:8;background:rgba(30,42,58,.5);display:flex;align-items:flex-end;justify-content:center}
#sheet[hidden]{display:none}
.sh{background:#fff;width:100%;max-width:480px;max-height:92dvh;overflow:auto;border-radius:24px 24px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom));animation:slide .25s ease-out}
@keyframes slide{from{transform:translateY(40px);opacity:0}}
.sh::before{content:"";display:block;width:40px;height:5px;border-radius:9px;background:#D3D9E2;margin:0 auto 14px}
.btn{display:block;width:100%;min-height:48px;margin-top:10px;border:0;border-radius:14px;background:var(--g);color:#fff;font:inherit;font-weight:700;text-align:center;line-height:48px;cursor:pointer}
.btn:disabled{opacity:.35;cursor:default}.btn.s{background:var(--bg);color:var(--ink)}
.prev{min-height:150px;border-radius:16px;background:var(--bg);display:grid;place-items:center;color:var(--mute);font-size:14px;overflow:hidden;margin:10px 0}
.prev img{width:100%;max-height:260px;object-fit:cover;display:block}
.ai{border-radius:16px;padding:12px 14px;background:color-mix(in srgb,var(--g) 9%,#fff);margin-top:10px}
.ai b{display:flex;align-items:center;gap:6px;color:var(--g)}.ai p{margin:4px 0}
.ai small,.n2{color:var(--mute);font-size:12px}
.ok{text-align:center;font-size:22px;font-weight:700;color:var(--g);margin:2px 0 8px}
#login{position:fixed;inset:0;z-index:20;background:#fff;overflow:auto}
#login[hidden]{display:none}
.lg-top{background:var(--g);color:#fff;text-align:center;padding:calc(48px + env(safe-area-inset-top)) 24px 40px;border-radius:0 0 32px 32px}
.lg-top i{width:84px;height:84px;margin:0 auto 14px;border-radius:26px;background:#fff;color:var(--g);display:grid;place-items:center;box-shadow:0 6px 16px rgba(0,0,0,.18)}
.lg-top h1{font-size:24px}.lg-top p{margin:6px 0 14px}
.lgc{display:flex;justify-content:center;gap:8px}.lgc .tag{background:#fff;color:var(--ink);margin:0}
.lg-form{max-width:480px;margin:0 auto;padding:12px 20px calc(24px + env(safe-area-inset-bottom))}
.lg-form label{display:block;font-size:13px;color:var(--mute);margin-top:12px}
.in{display:block;width:100%;min-height:48px;margin-top:6px;border:1.5px solid var(--line);border-radius:14px;padding:0 14px;font:inherit;font-size:16px;color:var(--ink);background:#fff}
.lg-form #lgin{margin-top:20px}
.or{text-align:center;color:var(--mute);font-size:13px;margin:14px 0 0}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header><div class="bar"><div class="logo"><i id="lg"></i><span>街たんけんノート(仮)</span></div><span class="chip lv" id="lvc"></span><span class="chip" id="ptc"></span></div></header>
<main id="app"></main>
<button class="fab" id="fab" aria-label="お題を撮る"></button>
<nav aria-label="メニュー"><button data-v="q"></button><button data-v="d"></button><button data-v="p"></button></nav>
<div id="sheet" hidden role="dialog" aria-modal="true"></div>
<section id="login" aria-label="ログイン">
<div class="lg-top"><i id="lgo"></i><h1>街たんけんノート(仮)</h1><p>街を歩いて、発見を図鑑に集めよう</p><div class="lgc"><span class="tag o">発見</span><span class="tag b">ことば</span><span class="tag g">SDGs</span></div></div>
<div class="lg-form"><label>メールアドレス<input class="in" type="email" autocomplete="off" placeholder="sample@example.com"></label><label>パスワード<input class="in" type="password" autocomplete="off" placeholder="••••••••"></label><button class="btn" id="lgin">ログイン</button><p class="or">または</p><button class="btn s" id="guest">ゲストではじめる</button><p class="n2" style="margin-top:14px">デモのため、入力内容は保存・送信されません。本物のメールアドレスやパスワードは入れないでください。</p></div>
</section>
<script>
const IC={flag:'<path d="M5 21V4M5 4h11l-2 4 2 4H5"/>',book:'<path d="M4 4.5A1.5 1.5 0 0 1 5.5 3H19v15H5.5A1.5 1.5 0 0 0 4 19.5z"/><path d="M4 19.5A1.5 1.5 0 0 0 5.5 21H19v-3"/>',coin:'<circle cx="12" cy="12" r="9"/><path d="M12 7v10M9.5 9.5h4a1.5 1.5 0 0 1 0 3h-3a1.5 1.5 0 0 0 0 3H15"/>',cam:'<path d="M4 8h3l1.5-2h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',search:'<circle cx="11" cy="11" r="6"/><path d="M16 16l4 4"/>',word:'<path d="M4 6h10M9 6c0 5-3 8-5 9M6 10c1 2 4 4 7 5M13 20l4-10 4 10M14.5 17h5"/>',leaf:'<path d="M5 19c0-8 5-14 15-14 0 9-5 15-13 15M5 19c3-5 6-8 10-10"/>',check:'<path d="M5 12l5 5 9-7"/>',spark:'<path d="M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/>'};
const ic=(n,s=24)=>`<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]}</svg>`;
const Q=[
{id:'a',k:'発見',c:'o',i:'search',t:'マンホールのふたを探そう',p:10,n:'マンホール',h:'マンホールの柄は街ごとに違い、土地の花や名所が描かれていることが多いです。'},
{id:'b',k:'発見',c:'o',i:'search',t:'変わった標識を見つけよう',p:10,n:'標識',h:'標識には、地域の注意やルールを伝えるご当地のデザインがあります。'},
{id:'c',k:'ことば',c:'b',i:'word',t:'知らない文字を見つけよう',p:10,n:'看板の文字',h:'「Terima kasih(テリマカシ)」はインドネシア語で「ありがとう」の意味です。'},
{id:'d',k:'SDGs',c:'g',i:'leaf',t:'ゴミを3個ひろおう',p:20,n:'ゴミ拾い',h:'ありがとう！街が少しきれいになりました。'}];
const $=s=>document.querySelector(s),app=$('#app'),sheet=$('#sheet'),P={};
let S={pts:0,done:[]},view='q',cur=null,photo=null;
try{S=JSON.parse(localStorage.getItem('mq2'))||S}catch(e){}
const save=()=>{try{localStorage.setItem('mq2',JSON.stringify(S))}catch(e){}};
const lv=()=>1+Math.floor(S.pts/50);
function qv(){const n=S.done.length;
return `<h1>きょうのお題</h1><p class="sub">${n}/${Q.length} クリア</p><div class="prog"><i style="width:${n/Q.length*100}%"></i></div>`+Q.map(q=>{const d=S.done.includes(q.id);
return `<article class="q ${q.c} ${d?'done':''}"><span class="ic">${ic(q.i)}</span><div><h2>${q.t}</h2><span class="tag">${q.k}</span><span class="pt">+${q.p}pt</span></div>${d?`<span class="go">${ic('check')}</span>`:`<button class="go" data-cap="${q.id}" aria-label="${q.t}を撮る">${ic('cam')}</button>`}</article>`}).join('')+'<p class="sub" style="text-align:center">お題は毎日かわります(デモでは4つ固定)</p>'}
function dv(){const slots=[...Q,{id:'x1'},{id:'x2'}];
return `<h1>図鑑</h1><p class="sub">${S.done.length}ページ集めた</p><section class="paper"><h2>わたしの街ずかん</h2><div class="dex">`+slots.map(s=>{const q=Q.find(x=>x.id===s.id),d=q&&S.done.includes(q.id);
return d?`<figure class="st ${q.c}">${P[q.id]?`<img class="im" src="${P[q.id]}" alt="${q.n}">`:`<div class="im">${ic(q.i,34)}</div>`}<figcaption>${q.n}</figcaption></figure>`:`<figure class="st e"><div class="im">？</div><figcaption>${q?'未発見':'？？？'}</figcaption></figure>`}).join('')+'</div></section>'}
function pv(){const n=S.pts%50;
return `<h1>ポイント</h1><p class="sub">協賛店のクーポンと交換できます</p><section class="card"><div class="ring"><svg viewBox="0 0 100 100" width="96" height="96"><circle cx="50" cy="50" r="42" fill="none" stroke="#E4E9F0" stroke-width="10"/><circle cx="50" cy="50" r="42" fill="none" stroke="var(--g)" stroke-width="10" stroke-linecap="round" stroke-dasharray="264" stroke-dashoffset="${264*(1-n/50)}" transform="rotate(-90 50 50)"/></svg><b>Lv.${lv()}</b></div><div><p class="big">${S.pts}<small>pt</small></p><p class="pt">次のレベルまであと${50-n}pt</p></div></section><h2 style="margin-bottom:10px">協賛店のクーポン<span class="pt">(サンプル)</span></h2>`+
[['○○カフェ','ドリンク50円引き',100],['△△公園の売店','ソフトクリーム20円引き',200],['□□商店街','コロッケ1個おまけ',300]].map(([a,b,c])=>`<article class="tk"><div><h2>${a}</h2><p>${b}</p></div><button data-cp ${S.pts>=c?'':'disabled'}>${c}pt<br>で交換</button></article>`).join('')+'<button class="lnk" id="lo">ログアウト</button><button class="lnk" id="rs">最初からやり直す</button>'}
function render(){app.innerHTML={q:qv,d:dv,p:pv}[view]();
$('#lg').innerHTML=ic('flag',20);$('#lvc').textContent='Lv.'+lv();$('#ptc').innerHTML=ic('coin',16)+S.pts;$('#fab').innerHTML=ic('cam',28);
const T={q:['flag','お題'],d:['book','図鑑'],p:['coin','ポイント']};
document.querySelectorAll('nav button').forEach(b=>{const t=T[b.dataset.v];b.innerHTML=ic(t[0])+t[1];b.dataset.v===view?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current')})}
function openCap(id){cur=Q.find(q=>q.id===id);photo=null;
sheet.innerHTML=`<div class="sh"><h2>${cur.t}</h2><div class="prev" id="pvw">写真をえらぶと、ここに表示されます</div><label class="btn">写真を撮る・えらぶ<input type="file" accept="image/*" capture="environment" hidden id="f"></label><button class="btn" id="go" disabled>AIに聞く</button><button class="btn s" id="demo">写真なしで試す</button><button class="btn s" id="cl">とじる</button><p class="n2">写真は端末の中だけで表示され、送信されません。人の顔は写さないでください。歩きながらの操作はしないでください。</p></div>`;
sheet.hidden=false;
$('#f').onchange=e=>{const f=e.target.files[0];if(!f)return;photo=URL.createObjectURL(f);$('#pvw').innerHTML=`<img src="${photo}" alt="選んだ写真">`;$('#go').disabled=false};
$('#go').onclick=ask;$('#demo').onclick=ask;$('#cl').onclick=()=>sheet.hidden=true}
function ask(){sheet.innerHTML='<div class="sh"><p class="sub" style="text-align:center;margin:20px 0">AIが解説を考えています…</p></div>';setTimeout(()=>{
sheet.innerHTML=`<div class="sh"><p class="ok">${cur.k==='SDGs'?'ありがとう！':'みつけた！'}</p>${photo?`<div class="prev"><img src="${photo}" alt="選んだ写真"></div>`:''}<div class="ai"><b>${ic('spark',18)}AIの解説</b><p>${cur.h}</p><small>※デモ用の決め打ちの解説です。本番は写真をAIが判別します。</small></div><button class="btn" id="reg">図鑑にのせる(+${cur.p}pt)</button></div>`;
$('#reg').onclick=()=>{const old=lv(),p=cur.p;S.done.push(cur.id);S.pts+=p;P[cur.id]=photo;save();sheet.hidden=true;render();pop(p);if(lv()>old)setTimeout(levelUp,900)}},700)}
function pop(n){const e=document.createElement('div');e.className='plus';e.textContent='+'+n+'pt';document.body.appendChild(e);setTimeout(()=>e.remove(),1200);const c=$('#ptc');c.classList.remove('bump');void c.offsetWidth;c.classList.add('bump')}
function levelUp(){sheet.hidden=false;sheet.innerHTML=`<div class="sh" style="text-align:center"><p class="ok">レベルアップ！</p><p class="big">Lv.${lv()}</p><p class="sub">新しいお題と図鑑のページが増えました。</p><button class="btn" id="ok">つづける</button></div>`;$('#ok').onclick=()=>sheet.hidden=true}
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;
if(t.dataset.v){view=t.dataset.v;render();scrollTo(0,0)}
else if(t.dataset.cap)openCap(t.dataset.cap);
else if(t.id==='fab'){const q=Q.find(q=>!S.done.includes(q.id));q?openCap(q.id):alert('きょうのお題は全部クリアしました！')}
else if(t.id==='lgin'||t.id==='guest'){$('#login').hidden=true;scrollTo(0,0)}
else if(t.id==='lo'){$('#login').hidden=false}
else if(t.dataset.cp!==undefined)alert('デモのため、交換はできません。');
else if(t.id==='rs'&&confirm('進み具合をリセットしますか？')){S={pts:0,done:[]};save();render()}});
$('#lgo').innerHTML=ic('flag',44);
render();
</script>
</body>
</html>
